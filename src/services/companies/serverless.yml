service: apro-click-admin-companies
frameworkVersion: '4'

useDotenv: true

custom:
  serviceSlug: companies
  pythonRequirements: ${file(../../serverless.pythonRequirements.yml):pythonRequirements}

package: ${file(../../serverless.package.yml):package}

provider:
  name: aws
  runtime: python3.13
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 28
  layers:
    - { Ref: PythonRequirementsLambdaLayer }
    - 'arn:aws:lambda:${self:provider.region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-x86_64:27'
  httpApi:
    cors: true
    payload: '2.0'
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    DATABASE_URL: ${env:DATABASE_URL, ''}
    SHOPIFY_API_VERSION: ${env:SHOPIFY_API_VERSION, '2026-04'}
    SHOPIFY_SHOP: ${env:SHOPIFY_SHOP, ''}
    COMPANIES_PUBLIC_API_KEY: ${env:COMPANIES_PUBLIC_API_KEY, ''}
    # Firma del link de crédito del correo de aprobación (apro/credit_link.py).
    CREDIT_LINK_SECRET: ${env:CREDIT_LINK_SECRET, ''}
    # Créditos de APRO: quién tiene crédito vigente. Es la fuente de verdad de
    # `payment_type` y, por lo tanto, de si el crédito se ve en el checkout.
    # Reusa host y token de la API de clientes (mismo servicio, otra ruta).
    # Sin configuración, la sincronización no corre y nada cambia.
    APRO_IA_CLIENTS_BASE_URL: ${env:APRO_IA_CLIENTS_BASE_URL, ''}
    APRO_IA_CLIENTS_BASE_URL_QA: ${env:APRO_IA_CLIENTS_BASE_URL_QA, ''}
    APRO_IA_BEARER_TOKEN: ${env:APRO_IA_BEARER_TOKEN, ''}
    APRO_IA_BEARER_TOKEN_QA: ${env:APRO_IA_BEARER_TOKEN_QA, ''}
    # Sin default acá: las llaves de `{rut}` las toma el parser de Serverless
    # como una variable suya. El default vive en shared/apro/credit_client.py.
    APRO_CREDIT_PATH_TEMPLATE: ${env:APRO_CREDIT_PATH_TEMPLATE, ''}
    # RUTs que siempre se consideran con crédito (empresas de prueba).
    APRO_CREDIT_FORCE_RUTS: ${env:APRO_CREDIT_FORCE_RUTS, ''}
    # Ambiente del link de solicitud de crédito (POST /credits/url): qa | prod.
    # Producción desde el 16-10-2026 (bloque «Solicitar crédito» y checkout).
    APRO_CREDIT_URL_ENV: ${env:APRO_CREDIT_URL_ENV, 'prod'}
    # Clave del webhook de estado de crédito (la misma que firma los webhooks
    # de APRO IA en `quotes`). Sin ella el webhook rechaza todo.
    APRO_IA_WEBHOOK_API_KEY: ${env:APRO_IA_WEBHOOK_API_KEY, ''}
    # Cola SQS del servicio notifications: aviso «crédito aprobado» al cliente.
    NOTIFICATIONS_QUEUE_URL:
      Fn::ImportValue: apro-click-${self:provider.stage}-notifications-queue-url
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            Fn::ImportValue: apro-click-${self:provider.stage}-notifications-queue-arn
        # Las rutas de panel validan el Access Token en el handler
        # (no hay authorizer en API Gateway).
        - Effect: Allow
          Action:
            - cognito-idp:GetUser
          Resource:
            Fn::ImportValue: apro-click-${self:provider.stage}-cognito-user-pool-arn

functions:
  # Sincroniza a diario `payment_type` con los créditos del DMS de APRO.
  creditSync:
    handler: handlers/credit_sync.lambda_handler
    timeout: 900
    memorySize: 512
    events:
      - schedule:
          rate: rate(1 day)
          enabled: true

  health:
    handler: handlers/health.lambda_handler
    events:
      - httpApi:
          path: /api/v1/health-${self:custom.serviceSlug}
          method: get

  companies:
    handler: handlers/companies.lambda_handler
    events:
      - httpApi:
          path: /api/v1/companies
          method: post
      - httpApi:
          path: /api/v1/companies
          method: get
      - httpApi:
          path: /api/v1/companies/{company_id}
          method: get
      - httpApi:
          path: /api/v1/companies/{company_id}
          method: put
      - httpApi:
          path: /api/v1/companies/{company_id}
          method: delete
      - httpApi:
          path: /api/v1/companies/{company_id}/assigned-user
          method: put
      - httpApi:
          path: /api/v1/companies/{company_id}/price-list
          method: put
      - httpApi:
          path: /api/v1/companies/{company_id}/addresses
          method: get
      - httpApi:
          path: /api/v1/companies/{company_id}/addresses
          method: post
      - httpApi:
          path: /api/v1/companies/{company_id}/addresses/{address_id}
          method: get
      - httpApi:
          path: /api/v1/companies/{company_id}/addresses/{address_id}
          method: put
      - httpApi:
          path: /api/v1/companies/{company_id}/addresses/{address_id}
          method: delete
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts
          method: get
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts
          method: post
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts/{client_id}
          method: get
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts/{client_id}
          method: put
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts/{client_id}
          method: delete
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts/{client_id}/main
          method: post
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts/{client_id}/locations
          method: get
      - httpApi:
          path: /api/v1/companies/{company_id}/contacts/{client_id}/locations
          method: put
      # Webhook de APRO: la empresa ganó o perdió su crédito.
      - httpApi:
          path: /api/v1/companies/webhooks/apro-ia/estado-credito
          method: post
      - httpApi:
          path: /api/v1/storefront/company/addresses
          method: get
      - httpApi:
          path: /api/v1/storefront/company/addresses
          method: post
      - httpApi:
          path: /api/v1/storefront/company/addresses/{address_id}
          method: put
      - httpApi:
          path: /api/v1/storefront/company/addresses/{address_id}
          method: delete
      - httpApi:
          path: /api/v1/storefront/company/contacts
          method: get
      # Crédito de la empresa para el checkout (extension credito-b2b).
      - httpApi:
          path: /api/v1/storefront/company/credit
          method: get
      # Link de APRO para solicitar crédito (bloque de tema credit-request).
      - httpApi:
          path: /api/v1/storefront/company/credit/url
          method: post
      # Link estable del correo de aprobación: pide el link de APRO y redirige.
      - httpApi:
          path: /api/v1/storefront/company/credit/go
          method: get
