service: apro-click-admin-quotes
frameworkVersion: '4'

useDotenv: true

custom:
  serviceSlug: quotes
  pythonRequirements: ${file(../../serverless.pythonRequirements.yml):pythonRequirements}
  # Bucket privado donde se guardan los PDF de las cotizaciones.
  pdfBucketName: apro-click-${self:provider.stage}-quotes-pdf

package: ${file(../../serverless.package.yml):package}

provider:
  name: aws
  runtime: python3.13
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 28
  layers:
    - { Ref: PythonRequirementsLambdaLayer }
    - 'arn:aws:lambda:${self:provider.region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-x86_64:27'
  httpApi:
    cors: true
    payload: '2.0'
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    DATABASE_URL: ${env:DATABASE_URL, ''}
    SHOPIFY_API_VERSION: ${env:SHOPIFY_API_VERSION, '2026-04'}
    # Clave compartida con el theme app extension (header X-Api-Key) para el
    # POST público y los GET de storefront (mis cotizaciones / descargar PDF).
    QUOTES_PUBLIC_API_KEY: ${env:QUOTES_PUBLIC_API_KEY, ''}
    # Secreto HMAC del link de descarga del PDF que va por email (sin login).
    QUOTES_PDF_LINK_SECRET: ${env:QUOTES_PDF_LINK_SECRET, ''}
    # Base URL pública del API (para construir el link del PDF en el email).
    QUOTES_PUBLIC_BASE_URL: ${env:QUOTES_PUBLIC_BASE_URL, ''}
    QUOTES_PDF_BUCKET: ${self:custom.pdfBucketName}
    # URL del servicio de cotización de envíos (para calcular tarifas por ciudad).
    SHIPPING_API_URL: ${env:SHIPPING_API_URL, ''}
    # APRO IA (DMS externo): URL base y token Bearer para sincronizar cotizaciones y obtener PDF.
    APRO_IA_BASE_URL: ${env:APRO_IA_BASE_URL, ''}
    APRO_IA_BEARER_TOKEN: ${env:APRO_IA_BEARER_TOKEN, ''}
    # Ambiente QA del mismo DMS (dms-qa.apro.cl). Credenciales propias: el token
    # de produccion devuelve 403 contra QA, no son intercambiables. Si quedan
    # vacias, el espejo a QA no corre y las rutas /qa responden ignored.
    APRO_IA_BASE_URL_QA: ${env:APRO_IA_BASE_URL_QA, ''}
    APRO_IA_BEARER_TOKEN_QA: ${env:APRO_IA_BEARER_TOKEN_QA, ''}
    # RUTs (coma-separados) habilitados para QA. Es la unica puerta: el espejo
    # de salida solo corre para estas empresas y los webhooks que entran por
    # /qa se descartan si el RUT no esta aca. Vacio = QA apagado.
    APRO_IA_QA_ALLOWED_RUTS: ${env:APRO_IA_QA_ALLOWED_RUTS, ''}
    # Clave que APRO IA envía en el header x-api-key de su webhook de eventos
    # (quotation.created/updated/approved/rejected). Distinta de QUOTES_PUBLIC_API_KEY.
    APRO_IA_WEBHOOK_API_KEY: ${env:APRO_IA_WEBHOOK_API_KEY, ''}
    # Vendedor por defecto para crear cotizaciones en APRO IA cuando la empresa no tiene
    # vendedor asignado (referred_by_user_id vacío). Debe ser un email registrado en APRO IA DMS.
    APRO_IA_DEFAULT_SELLER_EMAIL: ${env:APRO_IA_DEFAULT_SELLER_EMAIL, ''}
    # Código SAP por defecto cuando no se puede resolver el de un usuario (User.codigo_sap).
    # APRO IA identifica al vendedor por este código, no por el email.
    APRO_IA_DEFAULT_SELLER_SAP_CODE: ${env:APRO_IA_DEFAULT_SELLER_SAP_CODE, '000'}
    # SKU del producto «COSTO DE ENVIO» con que el envío viaja a APRO IA.
    APRO_IA_SHIPPING_SKU: ${env:APRO_IA_SHIPPING_SKU, '00000300000013'}
    # Manda el comentario de cada línea a APRO IA (products[].comment_product).
    # Apagado por defecto; la lectura desde el webhook va siempre.
    APRO_IA_LINE_COMMENTS: ${env:APRO_IA_LINE_COMMENTS, 'false'}
    # Cola SQS del servicio notifications para envío de emails.
    NOTIFICATIONS_QUEUE_URL:
      Fn::ImportValue: apro-click-${self:provider.stage}-notifications-queue-url
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:GetUser
          Resource:
            Fn::ImportValue: apro-click-${self:provider.stage}-cognito-user-pool-arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - !Sub arn:aws:s3:::${self:custom.pdfBucketName}/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            Fn::ImportValue: apro-click-${self:provider.stage}-notifications-queue-arn

functions:
  health:
    handler: handlers/health.lambda_handler
    events:
      - httpApi:
          path: /api/v1/health-${self:custom.serviceSlug}
          method: get

  quotes:
    handler: handlers/quotes.lambda_handler
    events:
      - httpApi:
          path: /api/v1/quotes
          method: post
      - httpApi:
          path: /api/v1/quotes
          method: get
      # Rutas específicas antes que GET/PATCH /{quote_id}.
      - httpApi:
          path: /api/v1/quotes/webhooks/apro-ia
          method: post
      - httpApi:
          path: /api/v1/quotes/webhooks/apro-ia/transferencias
          method: post
      # Pagos con crédito: mismo payload y mismo ciclo que transferencias,
      # cambia solo el tag del pedido en Shopify. APRO IA emite los dos
      # documentos por separado y por eso van en rutas distintas.
      - httpApi:
          path: /api/v1/quotes/webhooks/apro-ia/creditos
          method: post
      # Rutas del ambiente QA de APRO IA. El ambiente se decide por la URL (no
      # por la x-api-key) para que un evento de QA no pueda entrar por la ruta
      # productiva. Acotadas a APRO_IA_QA_ALLOWED_RUTS.
      - httpApi:
          path: /api/v1/quotes/webhooks/apro-ia/qa
          method: post
      - httpApi:
          path: /api/v1/quotes/webhooks/apro-ia/qa/transferencias
          method: post
      - httpApi:
          path: /api/v1/quotes/webhooks/apro-ia/qa/creditos
          method: post
      - httpApi:
          path: /api/v1/quotes/{quote_id}/pdf
          method: get
      - httpApi:
          path: /api/v1/quotes/{quote_id}/pay
          method: get
      - httpApi:
          path: /api/v1/quotes/{quote_id}/shipping-rates
          method: get
      - httpApi:
          path: /api/v1/quotes/{quote_id}/draft
          method: post
      - httpApi:
          path: /api/v1/quotes/{quote_id}/invoice
          method: post
      - httpApi:
          path: /api/v1/quotes/{quote_id}/complete
          method: post
      - httpApi:
          path: /api/v1/quotes/{quote_id}
          method: get
      - httpApi:
          path: /api/v1/quotes/{quote_id}
          method: patch

resources:
  Resources:
    QuotesPdfBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.pdfBucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldQuotePdfs
              Status: Enabled
              ExpirationInDays: 365

  Outputs:
    QuotesPdfBucketName:
      Value: !Ref QuotesPdfBucket
      Export:
        Name: apro-click-${self:provider.stage}-quotes-pdf-bucket
